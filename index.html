*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a}
.header{background:#1a1a1a;color:#fff;padding:20px 32px}
.header h1{font-size:20px;font-weight:500}
.header p{font-size:12px;color:#888;margin-top:4px}
.tabs{display:flex;gap:0;background:#222;padding:0 24px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:12px 20px;color:#999;cursor:pointer;font-size:13px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s}
.tab:hover{color:#fff;background:#333}
.tab.active{color:#fff;border-bottom-color:var(--accent)}
.container{max-width:1000px;margin:0 auto;padding:24px}
.card{background:#fff;border-radius:10px;border:1px solid #e0e0e0;padding:20px;margin-bottom:16px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.metric{border-radius:8px;padding:16px;background:var(--accent-light);border:1px solid var(--accent-border)}
.metric .label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.5px}
.metric .value{font-size:22px;font-weight:600;margin-top:4px}
.metric .sub{font-size:11px;color:#999;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 12px;border-bottom:2px solid #e0e0e0;font-weight:500;color:#666;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0}
tr:hover td{background:#fafaf8}
tfoot td{font-weight:500;border-top:2px solid #ccc;background:#fafaf8}
.chart-wrap{position:relative;height:280px;margin:12px 0}
.section-title{font-size:16px;font-weight:500;margin:28px 0 12px;padding-bottom:6px;border-bottom:1px solid #e0e0e0}
.section-title:first-of-type{margin-top:0}
.year-row td{font-weight:500;font-size:14px;background:var(--accent-light)}
.btn{padding:8px 16px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{background:#f5f5f0}
.right{text-align:right}
.month-row{cursor:pointer;user-select:none}
.month-row td:first-child::before{content:'\25b8 ';color:var(--accent);font-size:12px}
.month-row.open td:first-child::before{content:'\25be '}
.breakdown-row{display:none}
.breakdown-row.visible{display:table-row}
.breakdown-row td{padding:6px 12px 6px 32px;font-size:13px;color:#555;border-bottom:1px solid #f5f5f0;background:#fafaf8}
.svc-bar{display:inline-block;height:14px;border-radius:3px;margin-right:8px;vertical-align:middle;min-width:2px}
.person-view{display:none}
.person-view.active{display:block}
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:24px 0}
.overview-card{background:#fff;border-radius:10px;border:1px solid #e0e0e0;padding:20px;cursor:pointer;transition:transform .1s,box-shadow .1s}
.overview-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.overview-card .oc-name{font-size:16px;font-weight:600;margin-bottom:8px}
.overview-card .oc-stat{font-size:13px;color:#666;margin:4px 0}
.overview-card .oc-stat b{color:#1a1a1a}
.overview-card .oc-bar{height:4px;border-radius:2px;margin-top:12px}
@media(max-width:600px){.tabs{padding:0 8px}.tab{padding:10px 14px;font-size:12px}.metric-grid{grid-template-columns:repeat(2,1fr)}}
</style>

function fmt(cents){if(!cents||cents===0)return'\u2014';return'$'+(cents/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}

// Build tabs
let tabHtml='<div class="tab active" data-tab="overview" style="--accent:#555">Overview</div>';
for(const p of PEOPLE)tabHtml+=`<div class="tab" data-tab="${p.id}" style="--accent:${p.color}">${p.name.split(' ')[0]}</div>`;
document.getElementById('tabs').innerHTML=tabHtml;

// Build overview cards
let ovHtml='';
for(const p of PEOPLE){
  const d=ALL_DATA[p.id];
  const subNote=p.id==='recovery'?`<div class="oc-stat">Subscriptions: <b>${fmt(d.sub_r)}</b></div>`:'';
  const hrsWk=d.active_mo>0?Math.round(d.total_min/60/d.active_mo/4.33*10)/10:0;
  ovHtml+=`<div class="overview-card" data-goto="${p.id}" style="border-left:4px solid ${p.color}">
    <div class="oc-name" style="color:${p.color}">${p.name}</div>
    <div class="oc-stat">Sessions: <b>${d.total_s.toLocaleString()}</b></div>
    <div class="oc-stat">Net Revenue: <b>${fmt(d.total_r)}</b></div>
    ${subNote}
    ${d.total_min>0?`<div class="oc-stat">Avg hrs/wk: <b>${hrsWk}</b></div>`:''}
    <div class="oc-bar" style="background:${p.color}33"><div style="height:100%;border-radius:2px;background:${p.color};width:${Math.min(100,d.total_s/100)}%"></div></div>
  </div>`;
}
document.getElementById('overviewGrid').innerHTML=ovHtml;

// Build person views
let pvHtml='';
for(const p of PEOPLE){
  pvHtml+=`<div class="person-view" id="view-${p.id}" style="--accent:${p.color};--accent-light:${p.colorLight};--accent-border:${p.color}22">
    <div class="container">
      <div class="metric-grid" id="metrics-${p.id}"></div>
      <h2 class="section-title">Yearly summary</h2>
      <div class="card"><table><thead><tr><th>Year</th><th class="right">Sessions</th><th class="right">Hours</th><th class="right">Revenue</th><th class="right">Avg sessions/mo</th><th class="right">Avg hrs/wk</th></tr></thead><tbody id="year-${p.id}"></tbody></table></div>
      <h2 class="section-title">Monthly sessions</h2>
      <div class="card"><div class="chart-wrap"><canvas id="chart-s-${p.id}"></canvas></div></div>
      <h2 class="section-title">Monthly revenue</h2>
      <div class="card"><div class="chart-wrap"><canvas id="chart-r-${p.id}"></canvas></div></div>
      <h2 class="section-title">Monthly detail</h2>
      <div class="card"><table><thead><tr><th>Month</th><th class="right">Sessions</th><th class="right">Hours</th><th class="right">Revenue</th></tr></thead><tbody id="month-${p.id}"></tbody><tfoot id="foot-${p.id}"></tfoot></table></div>
      <div style="margin:8px 0 32px"><button class="btn" onclick="exportCSV('${p.id}')">Export as CSV</button></div>
    </div>
  </div>`;
}
document.getElementById('personViews').innerHTML=pvHtml;

// Render each person
const charts={};
for(const p of PEOPLE){
  const d=ALL_DATA[p.id];
  const data=d.data;
  const totalS=d.total_s;
  const totalR=d.total_r;
  const totalMin=d.total_min;
  const activeMo=d.active_mo||1;
  const hrsWk=totalMin>0?Math.round(totalMin/60/activeMo/4.33*10)/10:0;
  const r6=data.slice(-6);
  const r6S=r6.reduce((a,x)=>a+x.s,0);
  const r6R=r6.reduce((a,x)=>a+x.r,0);

  let metricsHtml=`
    <div class="metric"><div class="label">Total sessions</div><div class="value">${totalS.toLocaleString()}</div></div>
    <div class="metric"><div class="label">Net revenue</div><div class="value">${fmt(totalR)}</div></div>`;
  if(totalMin>0)metricsHtml+=`<div class="metric"><div class="label">Avg hrs/wk</div><div class="value">${hrsWk}</div><div class="sub">${Math.round(totalMin/60/activeMo)} hrs/mo</div></div>`;
  if(p.id==='recovery')metricsHtml+=`<div class="metric"><div class="label">Subscriptions</div><div class="value">${fmt(d.sub_r)}</div><div class="sub">A la carte: ${fmt(d.alc_r)}</div></div>`;
  metricsHtml+=`<div class="metric"><div class="label">Last 6mo</div><div class="value">${r6S.toLocaleString()}</div><div class="sub">${fmt(r6R)} revenue</div></div>`;
  document.getElementById('metrics-'+p.id).innerHTML=metricsHtml;

  // Yearly
  let yh='';
  for(const[y,yd]of Object.entries(d.years).sort()){
    if(!yd.s)continue;
    const mo=yd.months||1;
    const hw=yd.min>0?Math.round(yd.min/60/mo/4.33*10)/10:'\u2014';
    yh+=`<tr class="year-row"><td>${y}</td><td class="right">${yd.s.toLocaleString()}</td><td class="right">${yd.min?Math.round(yd.min/60):'\u2014'}</td><td class="right">${fmt(yd.r)}</td><td class="right">${Math.round(yd.s/mo)}</td><td class="right">${hw}</td></tr>`;
  }
  document.getElementById('year-'+p.id).innerHTML=yh;

  // Monthly detail
  let ts=0,tm=0,tr=0,mh='';
  for(const row of data){
    ts+=row.s;tm+=row.min||0;tr+=row.r;
    const[y,mo]=row.m.split('-');
    const label=new Date(y,mo-1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
    mh+=`<tr class="month-row" data-toggle="${p.id}-${row.m}"><td>${label}</td><td class="right">${row.s}</td><td class="right">${row.min?Math.round(row.min/60)+'h':'\u2014'}</td><td class="right">${fmt(row.r)}</td></tr>`;
    const bd=d.breakdown[row.m]||[];
    for(const svc of bd){
      mh+=`<tr class="breakdown-row" data-month="${p.id}-${row.m}"><td style="padding-left:32px;color:#888"><span class="svc-bar" style="width:${Math.max(2,Math.round(svc.s/(bd[0]?.s||1)*100))}px;background:${p.color}44"></span>${svc.n}</td><td class="right">${svc.s}</td><td class="right">${svc.min?Math.round(svc.min/60)+'h':'\u2014'}</td><td class="right">${fmt(svc.r)}</td></tr>`;
    }
  }
  document.getElementById('month-'+p.id).innerHTML=mh;
  document.getElementById('foot-'+p.id).innerHTML=`<tr><td>Total</td><td class="right">${ts.toLocaleString()}</td><td class="right">${tm?Math.round(tm/60)+'h':'\u2014'}</td><td class="right">${fmt(tr)}</td></tr>`;
}

// Lazy-render charts on tab switch
function renderCharts(pid){
  if(charts[pid])return;
  const p=PEOPLE.find(x=>x.id===pid);
  const d=ALL_DATA[pid];
  const data=d.data;
  const labels=data.map(x=>{const[y,mo]=x.m.split('-');return new Date(y,mo-1).toLocaleDateString('en-US',{month:'short',year:'2-digit'})});
  
  charts[pid]={
    s:new Chart(document.getElementById('chart-s-'+pid),{type:'bar',data:{labels,datasets:[{data:data.map(x=>x.s),backgroundColor:p.color,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{autoSkip:true,maxRotation:45}}}}}),
    r:new Chart(document.getElementById('chart-r-'+pid),{type:'bar',data:{labels,datasets:[{data:data.map(x=>Math.round(x.r/100)),backgroundColor:p.color+'cc',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{autoSkip:true,maxRotation:45}},y:{ticks:{callback:v=>'$'+v.toLocaleString()}}}}})
  };
}

// Tab switching
document.getElementById('tabs').addEventListener('click',function(e){
  const tab=e.target.closest('.tab');
  if(!tab)return;
  const id=tab.dataset.tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  document.querySelectorAll('.person-view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  if(id!=='overview')renderCharts(id);
});

// Click overview card to go to person
document.getElementById('overviewGrid').addEventListener('click',function(e){
  const card=e.target.closest('.overview-card');
  if(!card)return;
  const id=card.dataset.goto;
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.remove('active');
    if(t.dataset.tab===id)t.classList.add('active');
  });
  document.querySelectorAll('.person-view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  renderCharts(id);
});

// Monthly row toggle
document.addEventListener('click',function(e){
  const row=e.target.closest('.month-row[data-toggle]');
  if(!row)return;
  const key=row.dataset.toggle;
  row.classList.toggle('open');
  document.querySelectorAll(`.breakdown-row[data-month="${key}"]`).forEach(r=>r.classList.toggle('visible'));
});

function exportCSV(pid){
  const d=ALL_DATA[pid];
  let csv='Month,Sessions,Hours,Net Revenue\n';
  for(const row of d.data)csv+=row.m+','+row.s+','+(row.min?(row.min/60).toFixed(1):'0')+','+(row.r/100).toFixed(2)+'\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=pid+'-sessions.csv';a.click();
}
</script>
